
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Артём + Арина 🤍</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f7f2ea;color:#332b27;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
main{max-width:600px;margin:auto;padding:35px 20px 50px}
header{text-align:center;padding:25px 0 35px}
.small{font-size:11px;letter-spacing:3px;color:#a47a70}
h1{font-family:Georgia,serif;font-weight:400;font-size:43px;margin:20px 0 12px}
.subtitle{color:#897a71;font-size:14px;line-height:1.7}
.card{background:#fffdf9;border:1px solid #eadfd3;border-radius:20px;padding:20px;margin-bottom:22px}
h2{font-size:18px;font-weight:600;margin:0 0 16px}
textarea,select{
  width:100%;padding:14px;border:1px solid #e7dcd0;
  border-radius:12px;background:white;font:inherit;color:#332b27;
}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:13px;color:#817168;margin:13px 0 8px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px}
.add{width:100%;margin-top:14px;background:#b77b70;color:white}
.add:hover{background:#a66b60}
.heading{display:flex;justify-content:space-between;align-items:center;margin:30px 2px 15px}
.heading h2{margin:0}.count{font-size:12px;color:#a18f84}
.item{display:flex;align-items:flex-start;gap:12px;background:#fffdf9;border:1px solid #eadfd3;border-radius:15px;padding:15px;margin-bottom:10px}
.check{width:23px;height:23px;flex-shrink:0;border:1px solid #cdbdb0;border-radius:50%;padding:0;background:transparent;color:white}
.check.done{background:#71856d;border-color:#71856d}
.content{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.meta{font-size:12px;color:#a18f84;margin-top:8px}
.item.finished .content{text-decoration:line-through;color:#a18f84}
.remove{background:transparent;color:#a18f84;font-size:21px;padding:0 4px}
.empty{text-align:center;color:#a18f84;padding:25px 12px;border:1px dashed #d8c8b9;border-radius:15px;font-size:14px}
footer{text-align:center;color:#a18f84;font-size:12px;margin-top:35px}
</style>
</head>
<body>
<main>
<header>
  <div class="small">НАШ МАЛЕНЬКИЙ МИР</div>
  <h1>Артём + Арина</h1>
  <div class="subtitle">
    Всё, что мы сделаем,<br>
    когда будем рядом 🤍
  </div>
</header>

<section class="card">
  <h2>Добавить желание</h2>
  <textarea id="note" maxlength="1000"
    placeholder="Что хочешь сделать вместе?"></textarea>
  <label for="author">Кто добавляет?</label>
  <select id="author">
    <option value="Артём">Артём</option>
    <option value="Арина">Арина</option>
  </select>
  <button class="add" id="add">Добавить в наш список +</button>
</section>

<div class="heading">
  <h2>Наши желания</h2>
  <span class="count" id="count">0 идей</span>
</div>

<div id="list"></div>

<footer>Не забыть. Сделать вместе. Вспоминать 🤍</footer>
</main>

<script>
const KEY = "artem-arina-wishes";
let wishes = [];

try {
  wishes = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (!Array.isArray(wishes)) wishes = [];
} catch {
  wishes = [];
}

const $ = id => document.getElementById(id);

function save() {
  localStorage.setItem(KEY, JSON.stringify(wishes));
  render();
}

function render() {
  const count = wishes.length;
  $("count").textContent =
    count + " " + (count % 10 === 1 && count % 100 !== 11
      ? "идея"
      : [2,3,4].includes(count % 10) &&
        ![12,13,14].includes(count % 100) ? "идеи" : "идей");

  if (!count) {
    $("list").innerHTML =
      '<div class="empty">Пока здесь пусто.<br>Добавьте первое желание 🤍</div>';
    return;
  }

  const esc = value => String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);

  $("list").innerHTML = wishes.map(w => `
    <div class="item ${w.done ? "finished" : ""}">
      <button class="check ${w.done ? "done" : ""}"
        data-action="toggle" data-id="${esc(w.id)}">
        ${w.done ? "✓" : ""}
      </button>
      <div class="content">
        ${esc(w.text)}
        <div class="meta">${esc(w.author)} · ${esc(w.date)}</div>
      </div>
      <button class="remove" data-action="remove"
        data-id="${esc(w.id)}" aria-label="Удалить">×</button>
    </div>
  `).join("");
}

$("add").addEventListener("click", () => {
  const text = $("note").value.trim();
  if (!text) {
    $("note").focus();
    return;
  }

  wishes.unshift({
    id: Date.now().toString() + Math.random().toString(36).slice(2),
    text,
    author: $("author").value,
    date: new Date().toLocaleDateString("ru-RU"),
    done: false
  });

  $("note").value = "";
  save();
});

$("list").addEventListener("click", e => {
  const button = e.target.closest("button[data-action]");
  if (!button) return;

  const index = wishes.findIndex(w => w.id === button.dataset.id);
  if (index < 0) return;

  if (button.dataset.action === "toggle") {
    wishes[index].done = !wishes[index].done;
  } else if (button.dataset.action === "remove") {
    if (!confirm("Удалить это желание?")) return;
    wishes.splice(index, 1);
  }

  save();
});

render();
</script>
</body>
</html>
